name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --prefix frontend

      - run: npm --prefix frontend run test -- --run

      - run: npm --prefix frontend run build

  backend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --prefix backend

      - run: npx --prefix backend prisma generate

      - run: npx --prefix backend eslint "{src,test}/**/*.ts"

      - run: npm --prefix backend run test

      - run: npm --prefix backend run build
